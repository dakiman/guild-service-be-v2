# Project name pinned so volumes/networks (e.g. guild-service-be-v2_postgres_data)
# remain attached even if the folder is renamed.
name: guild-service-be-v2

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Host uses Tailscale MagicDNS (100.100.100.100), which the Docker embedded
# resolver in bridge networks can't reach. Pin public DNS for any service
# that makes outbound calls (Blizzard API).
x-dns: &default-dns
  - 1.1.1.1
  - 8.8.8.8

services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      args:
        INSTALL_XDEBUG: "true"
    restart: unless-stopped
    logging: *default-logging
    dns: *default-dns
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: 0
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan --version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:1.26-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    depends_on:
      app:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health-nginx || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  horizon:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      args:
        INSTALL_XDEBUG: "true"
    command: php artisan horizon
    restart: unless-stopped
    logging: *default-logging
    dns: *default-dns
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status | grep -q running"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  scheduler:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      args:
        INSTALL_XDEBUG: "true"
    command: php artisan schedule:work
    restart: unless-stopped
    logging: *default-logging
    dns: *default-dns
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: .env
    depends_on:
      app:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${DB_DATABASE:-guild_service}
      POSTGRES_USER: ${DB_USERNAME:-guild_service}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-guild_service} -d ${DB_DATABASE:-guild_service}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
